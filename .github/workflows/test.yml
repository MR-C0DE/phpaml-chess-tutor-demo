name: Test template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MR-C0DE/phpaml-framework
          path: .framework-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          tools: composer
      - run: composer validate --strict
      - name: Install framework source layout
        shell: bash
        run: mkdir -p runtime/framework && cp -R .framework-source/src/. runtime/framework/
      - run: composer install --no-interaction --prefer-dist
      - name: Lint application sources
        shell: bash
        run: find app configs tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run application tests
        run: php tests/run.php
      - name: Run PHPStan
        run: ./runtime/bin/phpstan analyse --no-progress
